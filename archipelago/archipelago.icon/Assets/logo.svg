<svg width="300" height="300" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- All triangles strictly meet at the exact center: (100, 100) -->
  
  <!-- Triangle 1 (Right) -->
  <polygon points="100,100 150,100 125,143.3" fill="#41AF55" />

  <!-- Triangle 2 (Bottom-Right) -->
  <polygon points="100,100 125,143.3 75,143.3" fill="#41AF55" />

  <!-- Triangle 3 (Bottom-Left) -->
  <polygon points="100,100 75,143.3 50,100" fill="#41AF55" />

  <!-- Triangle 4 (Left) -->
  <polygon points="100,100 50,100 75,56.7" fill="#41AF55" />

  <!-- Triangle 5 (Top-Left) -->
  <polygon points="100,100 75,56.7 125,56.7" fill="#dedede" />

  <!-- Triangle 6 (Top-Right) -->
  <polygon points="100,100 125,56.7 150,100" fill="#4f4f4f" />

  <!-- Hexagon Outer Outline -->
  <polygon points="150,100 125,143.3 75,143.3 50,100 75,56.7 125,56.7" fill="none" stroke="#ffd29e" stroke-width="6" stroke-linejoin="round" />
</svg>